name: Build and deploy .NET Core application to Web App api-qrassignment

on:
  workflow_dispatch:
  push:
    branches:
      - main  # master'ı kaldırdık

env:
  AZURE_WEBAPP_NAME: api-qrassignment
  AZURE_WEBAPP_PACKAGE_PATH: '${{ github.workspace }}/publish' # Garantili mutlak yol
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore $(find . -name "*.sln" -print -quit)

      - name: Build
        run: dotnet build $(find . -name "*.sln" -print -quit) --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish
        # UYARI: Buradaki csproj yolunu kendi projene göre (Örn: src/QrAssignment.WebApi/QrAssignment.WebApi.csproj) güncelle!
        run: dotnet publish "TemplateProject.WebApi/QrAssignment.WebApi.csproj" --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} # İndirme yolunu açıkça belirtiyoruz

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} # Doğru klasörden deploy edilecek